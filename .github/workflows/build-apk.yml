name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        run: npm run build

      - name: Install Capacitor Tooling
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Initialize or Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Optimize Gradle Wrapper (use binary distribution)
        run: |
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            # Replace heavy -all.zip (180MB) with lighter -bin.zip (50MB) to prevent 502/timeout errors
            sed -i 's/-all\.zip/-bin\.zip/' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle (with auto-retry)
        run: |
          cd android
          # Run gradle build with retries in case of transient download glitch
          for attempt in 1 2 3; do
            echo "Starting Gradle build attempt $attempt..."
            ./gradlew assembleDebug --stacktrace --no-daemon && break || {
              if [ $attempt -eq 3 ]; then
                echo "All Gradle build attempts failed."
                exit 1
              fi
              echo "Attempt $attempt failed. Waiting 5s before retry..."
              sleep 5
            }
          done

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Vaultly-v2.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vaultly-v2.0-debug-apk
          path: build-output/Vaultly-v2.0-debug.apk
          retention-days: 30
