const luhn=n=>{let s=0,d=false;for(let i=n.length-1;i>=0;i--){let x=+n[i];if(d){x*=2;if(x>9)x-=9}s+=x;d=!d}return s%10===0};
const VARS=['World Elite','Signature','Platinum','World','Infinite','Titanium','Select','Gold','Classic','Premium'];
function parseCard(t){const out={};const cands=(t.match(/(?:\d[ -]?){13,19}/g)||[]).map(x=>x.replace(/\D/g,'')).filter(x=>x.length>=13&&x.length<=19);
 out.number=cands.find(luhn)||cands[0]||'';
 const rest=t.replace(/(?:\d[ -]?){13,19}/g,' ');const m=rest.match(/(0[1-9]|1[0-2])\s*[\/\-]\s*(\d{4}|\d{2})\b/);if(m)out.expiry=m[1]+'/'+m[2].slice(-2);
 const skip=/BANK|VALID|THRU|DEBIT|CREDIT|VISA|MASTER|RUPAY|PLATINUM|SIGNATURE|CARD|GOOD|MEMBER|SINCE|CLASSIC|GOLD|WORLD|INFINITE|PREMIUM|SELECT|TITANIUM/;
 const nm=t.split(/\n/).map(l=>l.trim()).find(l=>/^[A-Z][A-Z .'-]{4,}$/.test(l)&&/\s/.test(l)&&!skip.test(l));if(nm)out.holder=nm;
 const U=t.toUpperCase();const bk=[['HDFC','HDFC'],['ICICI','ICICI'],['AXIS','Axis'],['STATE BANK','SBI'],['SBI','SBI'],['KOTAK','Kotak'],['INDUSIND','IndusInd'],['IDFC','IDFC First'],['AMERICAN EXPRESS','Amex']].find(([k])=>U.includes(k));if(bk)out.bank=bk[1];
 out.network=brand(out.number)||(U.includes('RUPAY')?'RuPay':U.includes('MASTERCARD')?'Mastercard':U.includes('VISA')?'Visa':U.includes('AMERICAN EXPRESS')?'Amex':'');
 const V=VARS.find(v=>U.includes(v.toUpperCase()));if(V)out.variant=V;return out}

function shrink(f,mx){mx=mx||1000;return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=u})}

async function addBill(cid){const c=byId(cid),now=new Date(),v=await sheet('Record a bill for '+(c.name||c.bank),[{id:'m',l:'Month',txt:1,ph:'YYYY-MM',def:now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')},{id:'a',l:'Amount (₹)',txt:1,ph:'e.g. 45000'},{id:'d',l:'Due date (optional)',date:1}],'Save bill');if(!v)return;
 if(!/^\d{4}-\d{2}$/.test(v.m||''))return toast('Month should look like 2026-11');const amt=String(v.a||'').replace(/\D/g,'');if(!amt)return toast('Enter the bill amount');

const bRem=b=>Math.max(0,(+b.amount||0)-(+b.paidAmt||0));
function applyPay(b,c,a){a=Math.min(bRem(b),Math.round(+a||0));if(a<=0)return 0;b.paidAmt=(+b.paidAmt||0)+a;if(c)c.owed=String(Math.max(0,(+c.owed||0)-a));
 if(bRem(b)<=0){b.paid=true;b.paidAt=Date.now();if(c)c.lastPaidMonth=(b.due||b.month).slice(0,7)}return a}

 const v=await sheet('Payment for the '+b.month+' bill',[{id:'a',l:'Amount paid (₹). Lower it for a part payment',txt:1,def:String(rem)}],'Save payment');if(!v)return;
 const a=applyPay(b,byId(b.cardId),String(v.a||'').replace(/[^\d.]/g,''));if(!a)return toast('Enter an amount');
 await persist();render();toast(b.paid?'Bill paid in full · balance reduced':'Part payment saved · ₹ '+bRem(b).toLocaleString('en-IN')+' left')}
async function addSpend(cid){const c=byId(cid),today=new Date().toISOString().slice(0,10),v=await sheet('Record a spend on '+(c.name||c.bank),[{id:'a',l:'Amount (₹)',txt:1,ph:'e.g. 1250'},{id:'cat',l:'Category',opts:CATS},{id:'d',l:'Date',date:1,def:today},{id:'n',l:'Note (optional)',txt:1}],'Save spend');if(!v)return;const amt=String(v.a||'').replace(/\D/g,'');if(!amt)return toast('Enter the amount');
 S.vault.tx=S.vault.tx||[];S.vault.tx.push({id:uid(),cardId:cid,date:v.d||today,amount:amt,cat:v.cat,note:v.n||''});if(c&&c.kind!=='Debit')c.owed=String((+c.owed||0)+(+amt));await persist();render();toast('Spend recorded · balance updated')}

 const seg=`<div class="seg" style="margin-top:16px"><button class="${S.insMode==='sp'?'on':''}" onclick="S.insMode='sp';render()">Recorded spends</button><button class="${S.insMode==='out'?'on':''}" onclick="S.insMode='out';render()">Outstanding now</button></div>`;

  const rows=cards.map(c=>{const ow=+c.owed||0;if(ow)tot+=ow;const bl=(S.vault.bills||[]).filter(x=>x.cardId===c.id&&!x.paid),bs=bl.reduce((a,x)=>a+bRem(x),0);if(bs)btot+=bs;if(!ow&&!bs)return'';

 const byCat={},byCard={};tx.forEach(t=>{byCat[t.cat||'Other']=(byCat[t.cat||'Other']||0)+(+t.amount||0);const c=byId(t.cardId),nm=c?(c.name||c.bank):'Deleted card';byCard[nm]=(byCard[nm]||0)+(+t.amount||0)});
 const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]),cards=Object.entries(byCard).sort((a,b)=>b[1]-a[1]);
 return head+seg+`
 <div class="row sp" style="margin-top:14px"><button class="ib" aria-label="Previous month" onclick="insNav(-1)">‹</button><h2 style="margin:0">${new Date(y,m-1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h2><button class="ib" aria-label="Next month" onclick="insNav(1)">›</button></div>

function parseNotif(n){const t=((n.title||'')+' '+(n.text||''));const m=t.match(/(?:rs\.?|₹|inr)\s*([\d,]+(?:\.\d{1,2})?)/i);if(!m)return null;const amount=Math.round(parseFloat(m[1].replace(/,/g,'')));if(!amount)return null;
 const card=t.match(/\b(?:x{1,4}|\*{1,4})\s*(\d{4})\b/i)||t.match(/\b(?:ending|card|a\/c)\s*(?:with\s*)?(?:no\.?\s*)?(\d{4})\b/i);

function remList(){const out=[],now=Date.now(),lead=CFG.lead*864e5,T=new Date(),at9=(y,m,d)=>new Date(y,m,d,9,0,0).getTime();

 const add=(t,body)=>{if(t>now)out.push({at:t,title:'Vaultly reminder',body})};
 for(const c of S.vault.cards.filter(x=>!x.blocked)){const nm=c.name||c.bank;
  for(const[k,txt]of[['billDay','bill is due'],['stmtDay','statement is generated']]){const d=+c[k];if(!d)continue;
   for(let i=0;i<5;i++){const dt=new Date(T.getFullYear(),T.getMonth()+i,1),ym=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');if(k==='billDay'&&c.lastPaidMonth===ym)continue;add(dom(dt.getFullYear(),dt.getMonth(),d)-lead,`${nm} ${txt} ${CFG.lead?'in '+CFG.lead+(CFG.lead===1?' day':' days'):'today'}`)}}
  if(c.feeDate){const[y,m,d]=c.feeDate.split('-').map(Number);if(m&&d)for(let i=0;i<2;i++)add(at9(T.getFullYear()+i,m-1,d)-7*864e5,`${nm} annual fee is due on ${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}`)}}
 for(const it of(S.vault.items||[])){if(it.type==='id'&&it.expiry){const[y,m,d]=it.expiry.split('-').map(Number);if(y)add(at9(y,m-1,d)-30*864e5,`${it.idtype} expires on ${fd(it.expiry)}`)}
  if(it.type==='ins'&&it.renew){const[y,m,d]=it.renew.split('-').map(Number);if(y)add(at9(y,m-1,d)-30*864e5,`${TYPES.ins.ttl(it)} renews on ${fd(it.renew)}`)}
